<div class="modal fade" id="removeModal{{ batch.pk }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{% url 'inventory:remove_from_stock' batch.pk %}">
                {% csrf_token %}
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-trash"></i> Retirer du stock
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">
                        <strong>{{ batch.medicine.name }}</strong><br>
                        <small>Lot {{ batch.batch_number }} — stock actuel : {{ batch.quantity }} unités</small>
                    </p>
                    <div class="mb-3">
                        <label class="form-label">Quantité à retirer</label>
                        <input type="number" name="quantity" class="form-control"
                               value="{{ batch.quantity }}" min="1" max="{{ batch.quantity }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motif</label>
                        <select name="reason" class="form-select" required>
                            <option value="expired">Périmé</option>
                            <option value="damaged">Endommagé / cassé</option>
                            <option value="recall">Rappel fournisseur</option>
                            <option value="return">Retour fournisseur</option>
                            <option value="loss">Perte / vol</option>
                            <option value="other">Autre</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes (optionnel)</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="alert alert-warning py-2 mb-0">
                        <i class="bi bi-info-circle"></i>
                        Perte estimée :
                        <strong id="loss-{{ batch.pk }}">
                            {{ batch.quantity|floatformat:0 }} × {{ batch.medicine.purchase_price|floatformat:0 }} =
                            {{ batch.quantity|floatformat:0 }} FCFA
                        </strong>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-check-circle"></i> Confirmer le retrait
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
