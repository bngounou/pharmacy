{% extends "base.html" %}
{% block title %}Désactiver {{ object.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning"><h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Désactivation</h4></div>
            <div class="card-body">
                <p>Confirmer la <strong>désactivation</strong> de :</p>
                <h5>{{ object.name }}</h5>
                <p class="text-muted">Le médicament sera retiré du POS mais l'historique des ventes restera intact.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> Désactiver
                        </button>
                        <a href="{% url 'inventory:medicine_detail' object.pk %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
